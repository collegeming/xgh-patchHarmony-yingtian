name: Build android17-6.18

on:
  push:
    branches: [ yingtian-6.18 ]
    paths:
      - '.github/workflows/build-6.18.yml'
      - 'src/**'
      - 'Makefile'
      - 'mk/**'
      - 'deps.lst'
      - 'scripts/fetch-deps.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android17-6.18-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      - name: Build android17-6.18
        run: |
          make VER=android17-6.18 > build.log 2>&1 || { tail -80 build.log; exit 1; }
          tail -10 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-android17-6.18-xgh
          path: |
            out/android17-6.18/droid_lkm.ko
            out/android17-6.18/droid_lkm_vendor.ko
          if-no-files-found: warn
